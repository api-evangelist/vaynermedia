apis:
  - aid: vaynermedia:wordpress-content-api
    name: VaynerMedia WordPress Content API
    description: >-
      vaynermedia.com is a self-hosted WordPress site on WP Engine, and it leaves the WordPress
      REST API open for anonymous reads at https://vaynermedia.com/wp-json/. The site's own route
      index registers 365 routes across 17 namespaces; the portion that is actually callable
      without credentials is the wp/v2 content surface — posts (267), pages (51), media (1,693),
      categories, tags, comments, cross-type search (342 indexed records), the type/status/taxonomy
      registries, and two custom post types the agency registered itself: case_study (its published
      client case studies) and salient_g_sections. Popup Maker's popups and themes are also public.
      Writes, templates, menu-items, settings and users are gated (401/403). This is not a developer
      product and VaynerMedia does not document, version, rate-limit or support it — it is the
      content surface of the agency's marketing site, and the only callable API the company exposes.
      The OpenAPI in this repo was derived by API Evangelist from the provider's own /wp-json/ route
      index; VaynerMedia publishes no OpenAPI, and the only human reference is WordPress core's.
    humanURL: https://developer.wordpress.org/rest-api/
    baseURL: https://vaynermedia.com/wp-json
