summary: >-
  VaynerMedia publishes no API lifecycle commitments of any kind. The content API's version
  is whatever WordPress core ships; there is no versioning policy, no deprecation policy, no
  Sunset/Deprecation header practice, no SLA and no status page. This file records those
  absences with the probes behind them, and deliberately carries NO `type: StatusPage` and
  NO `type: Deprecation` pointer in apis.yml.

versioning:
  scheme: namespace-in-path
  current_version: wp/v2
  first_seen: 'wp/v2 has been the WordPress core REST namespace since WordPress 4.7 (2016)'
  policy_published: false
  policy_url: null
  note: >-
    The version is set by the WordPress release VaynerMedia runs, not by VaynerMedia. A core
    upgrade to a future wp/v3 would change this surface with no notice from the agency.

deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No RFC 8594 Sunset or Deprecation header was observed on any response. No deprecated
    operations exist in the derived OpenAPI because the derived surface is WordPress core's
    current namespace.

sla:
