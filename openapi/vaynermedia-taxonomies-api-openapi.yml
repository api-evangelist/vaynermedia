openapi: 3.2.0
info:
  title: VaynerMedia WordPress Content Taxonomies API
  version: wp/v2
  summary: Public read surface of the WordPress REST API served at vaynermedia.com/wp-json/.
  description: VaynerMedia runs vaynermedia.com on self-hosted WordPress (WP Engine) and leaves the WordPress REST API open for anonymous reads.
  contact:
    name: VaynerMedia
    url: https://vaynermedia.com/connect/
  x-derived-from: https://vaynermedia.com/wp-json/
  x-derived-on: '2026-08-12'
  x-upstream-documentation: https://developer.wordpress.org/rest-api/
servers:
- url: https://vaynermedia.com/wp-json
  description: Production WordPress REST API for vaynermedia.com
security: []
tags:
- name: Taxonomies
  description: Registered taxonomies.
paths:
  /wp/v2/taxonomies:
    get:
      operationId: list_taxonomies
      summary: List taxonomies
      description: Registered taxonomies. Read-only for anonymous callers; the collection also accepts POST for authenticated editors, which is not documented here.
      tags:
      - Taxonomies
      parameters:
      - name: context
        in: query
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      - name: type
        in: query
        description: Limit results to taxonomies associated with a specific post type.
        schema:
          type: string
      responses:
        '200':
          description: A list of taxonomies.
          headers:
            X-WP-Total:
              description: Total number of matching records.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
            Link:
              description: RFC 8288 pagination links (rel=next / rel=prev).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      security:
      - {}
components:
  responses:
    Error:
      description: WordPress error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: WordPress REST API error envelope (WP_Error serialized to JSON).
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. rest_no_route.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
            params:
              type: object
              description: Per-parameter validation messages, when present.
            details:
              type: object
              description: Per-parameter error objects, when present.
          required:
          - status
      required:
      - code
      - message
      examples:
      - code: rest_no_route
        message: No route was found matching the URL and request method.
        data:
          status: 404
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress Application Passwords. Advertised by the site's own route index (authentication.application-passwords.endpoints.authorization = https://vaynermedia.com/wp-admin/authorize-application.php). Required only for write operations and privileged reads; every operation in this document is callable anonymously.
